<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Můj web | Kontakt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Můj osobní web</h1>

        <nav>
            <a href="index.html">Domů</a>
            <a href="galerie.html">Galerie</a>
            <a href="rozvrh.html">Rozvrh</a>
            <a href="kontakt.html">Kontakt</a>
        </nav>
    </header>

    <main>
        <form>
            <label for="Jmeno">Jméno:</label>
            <input type="text" name="Jmeno" id="Jmeno" required>
            <label for="mail">Email:</label>
            <input type="email" name="mail" id="mail" required>
            <label for="vek">Věk:</label>
            <input type="number" name="vek" id="vek" required>
            <label for="Heslo">Heslo:</label>
            <input type="password" name="Heslo" id="Heslo" required>
            <select>
                <option value="moznost">Možnost</option>
                <option value="moznost2">Možnost2</option>
                <option value="moznost3">Možnost3</option>
            </select>
            <input type="reset">
            <button type="submit">Odeslat</button>
        </form>
    </main>

    <footer>
        <p>Vytvořeno v hodinách Úvodu do WWW</p>
    </footer>
</body>
</html>
